<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quay Số cùng Hoàng Huy Green River</title>
    <style>
        /* ===== BẢNG MÀU ===== */
        :root {
            --primary-dark: #193D49;
            --primary: #2E5E5B;
            --accent-light: #E6D0C7;
            --accent: #C0AFA4;
            --accent-dark: #A48574;
            --white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--white);
        }

        /* ===== HEADER ===== */
        header {
            width: 100%;
            background: var(--primary-dark);
            padding: 20px 0;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            border-bottom: 4px solid var(--accent);
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--accent-light);
        }

        header h1 span {
            color: var(--accent);
            font-weight: 300;
        }

        header p {
            margin-top: 5px;
            font-size: 0.95rem;
            color: var(--accent);
            opacity: 0.8;
        }

        /* ===== MAIN CONTENT ===== */
        .container {
            max-width: 700px;
            width: 90%;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px 30px;
            border: 1px solid rgba(192, 175, 164, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        /* ===== SETTINGS ===== */
        .settings {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 30px;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
        }

        .setting-group label {
            font-size: 0.85rem;
            color: var(--accent-light);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .setting-group input {
            width: 100px;
            padding: 10px 12px;
            border: 2px solid var(--accent);
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--white);
            font-size: 1.1rem;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }

        .setting-group input:focus {
            border-color: var(--accent-light);
        }

        .setting-group input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        /* ===== DISPLAY ===== */
        .display-area {
            text-align: center;
            margin: 30px 0;
        }

        .number-display {
            font-size: 6rem;
            font-weight: 800;
            color: var(--accent-light);
            text-shadow: 0 0 30px rgba(230, 208, 199, 0.3);
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
            user-select: none;
        }

        .number-display.spinning {
            animation: pulse 0.1s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .result-label {
            font-size: 1rem;
            color: var(--accent);
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* ===== BUTTONS ===== */
        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn {
            padding: 14px 36px;
            font-size: 1.1rem;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
            color: var(--white);
            box-shadow: 0 6px 20px rgba(164, 133, 116, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(164, 133, 116, 0.6);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: transparent;
            color: var(--accent-light);
            border: 2px solid var(--accent);
        }

        .btn-secondary:hover {
            background: var(--accent);
            color: var(--primary-dark);
        }

        /* ===== HISTORY ===== */
        .history-section {
            margin-top: 35px;
            border-top: 1px solid rgba(192, 175, 164, 0.2);
            padding-top: 25px;
        }

        .history-section h3 {
            text-align: center;
            color: var(--accent-light);
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 15px;
        }

        .history-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
        }

        .history-list::-webkit-scrollbar {
            width: 6px;
        }

        .history-list::-webkit-scrollbar-thumb {
            background: var(--accent);
            border-radius: 3px;
        }

        .history-item {
            background: rgba(192, 175, 164, 0.15);
            border: 1px solid var(--accent);
            border-radius: 10px;
            padding: 8px 16px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--accent-light);
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }

        .history-item .order {
            font-size: 0.7rem;
            color: var(--accent);
            display: block;
            text-align: center;
            font-weight: 400;
        }

        .no-history {
            text-align: center;
            color: var(--accent);
            opacity: 0.6;
            font-style: italic;
        }

        /* ===== FOOTER ===== */
        footer {
            margin-top: auto;
            padding: 20px;
            text-align: center;
            color: var(--accent);
            font-size: 0.85rem;
            opacity: 0.7;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 500px) {
            header h1 {
                font-size: 1.4rem;
            }

            .number-display {
                font-size: 4rem;
            }

            .container {
                padding: 25px 15px;
            }

            .btn {
                padding: 12px 24px;
                font-size: 0.95rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>🎰 Quay Số cùng <span>Hoàng Huy Green River</span></h1>
        <p>Random Number Generator</p>
    </header>

    <div class="container">
        <!-- Settings -->
        <div class="settings">
            <div class="setting-group">
                <label>Từ số</label>
                <input type="number" id="minNum" value="1" min="0">
            </div>
            <div class="setting-group">
                <label>Đến số</label>
                <input type="number" id="maxNum" value="100" min="1">
            </div>
            <div class="setting-group">
                <label>Số lượng</label>
                <input type="number" id="countNum" value="1" min="1" max="50">
            </div>
        </div>

        <!-- Display -->
        <div class="display-area">
            <div class="number-display" id="numberDisplay">?</div>
            <div class="result-label" id="resultLabel">Nhấn nút để quay số</div>
        </div>

        <!-- Buttons -->
        <div class="buttons">
            <button class="btn btn-primary" id="spinBtn" onclick="startSpin()">
                 Quay Số
            </button>
            <button class="btn btn-secondary" onclick="resetAll()">
                🔄 Đặt lại
            </button>
        </div>

        <!-- History -->
        <div class="history-section">
            <h3>📋 Lịch sử quay số</h3>
            <div class="history-list" id="historyList">
                <p class="no-history">Chưa có kết quả</p>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Hoàng Huy Green River. All rights reserved.
    </footer>

    <script>
        let isSpinning = false;
        let history = [];
        let spinInterval;

        function getRandomInt(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }

        function startSpin() {
            if (isSpinning) return;

            const min = parseInt(document.getElementById('minNum').value);
            const max = parseInt(document.getElementById('maxNum').value);
            const count = parseInt(document.getElementById('countNum').value);

            if (isNaN(min) || isNaN(max) || isNaN(count)) {
                alert('Vui lòng nhập đầy đủ thông tin!');
                return;
            }

            if (min >= max) {
                alert('Số bắt đầu phải nhỏ hơn số kết thúc!');
                return;
            }

            if (count < 1 || count > 50) {
                alert('Số lượng phải từ 1 đến 50!');
                return;
            }

            isSpinning = true;
            const btn = document.getElementById('spinBtn');
            const display = document.getElementById('numberDisplay');
            const label = document.getElementById('resultLabel');

            btn.disabled = true;
            display.classList.add('spinning');
            label.textContent = 'Đang quay...';

            // Animation spinning effect
            let spinCount = 0;
            const totalSpins = 20;

            spinInterval = setInterval(() => {
                display.textContent = getRandomInt(min, max);
                spinCount++;

                if (spinCount >= totalSpins) {
                    clearInterval(spinInterval);
                    finishSpin(min, max, count);
                }
            }, 80);
        }

        function finishSpin(min, max, count) {
            const display = document.getElementById('numberDisplay');
            const label = document.getElementById('resultLabel');
            const btn = document.getElementById('spinBtn');

            // Generate final results
            const results = [];
            for (let i = 0; i < count; i++) {
                results.push(getRandomInt(min, max));
            }

            // Show result
            if (count === 1) {
                display.textContent = results[0];
            } else {
                display.textContent = results.join(', ');
                display.style.fontSize = results.length > 5 ? '3rem' : '4rem';
            }

            display.classList.remove('spinning');
            label.textContent = `Kết quả: ${count} số từ ${min} đến ${max}`;

            // Add to history
            results.forEach((num, index) => {
                history.unshift({
                    number: num,
                    time: new Date().toLocaleTimeString('vi-VN'),
                    order: history.length + 1
                });
            });

            updateHistory();

            btn.disabled = false;
            isSpinning = false;

            // Reset font size after a delay
            setTimeout(() => {
                display.style.fontSize = '';
            }, 3000);
        }

        function updateHistory() {
            const historyList = document.getElementById('historyList');

            if (history.length === 0) {
                historyList.innerHTML = '<p class="no-history">Chưa có kết quả</p>';
                return;
            }

            historyList.innerHTML = history.map((item, index) => `
                <div class="history-item">
                    <span class="order">#${history.length - index}</span>
                    ${item.number}
                </div>
            `).join('');
        }

        function resetAll() {
            if (isSpinning) return;

            history = [];
            document.getElementById('numberDisplay').textContent = '?';
            document.getElementById('resultLabel').textContent = 'Nhấn nút để quay số';
            document.getElementById('minNum').value = 1;
            document.getElementById('maxNum').value = 100;
            document.getElementById('countNum').value = 1;
            updateHistory();
        }

        // Allow Enter key to spin
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !isSpinning) {
                startSpin();
            }
        });
    </script>

</body>
</html>
